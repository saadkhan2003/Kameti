[build]
  command = "([ -d flutter ] || git clone https://github.com/flutter/flutter.git -b stable --depth 1) && ./flutter/bin/flutter config --enable-web && mkdir -p assets && printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nGOOGLE_WEB_CLIENT_ID=%s\nCLOUDINARY_CLOUD_NAME=%s\nCLOUDINARY_UPLOAD_PRESET=%s' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" \"$GOOGLE_WEB_CLIENT_ID\" \"$CLOUDINARY_CLOUD_NAME\" \"$CLOUDINARY_UPLOAD_PRESET\" > assets/env && ./flutter/bin/flutter build web --release --no-tree-shake-icons"
  publish = "build/web"

[build.environment]
  FLUTTER_CHANNEL = "stable"
